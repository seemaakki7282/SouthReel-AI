<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SouthReel AI Pro</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
color:#00ff99;
}

textarea,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
border-radius:8px;
}

button{
width:100%;
padding:15px;
font-size:20px;
background:#00ff99;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00dd88;
}

pre{
margin-top:20px;
background:#222;
padding:15px;
border-radius:10px;
white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h1>🎬 SouthReel AI Pro</h1>

<label>Video Topic</label>

<textarea id="topic" placeholder="Example: Pushpa 3"></textarea>

<label>Language</label>

<select id="language">
<option>English</option>
<option>Hindi</option>
<option>Gujarati</option>
</select>

<label>Category</label>

<select id="category">
<option>Movies</option>
<option>Football</option>
<option>Gaming</option>
<option>Technology</option>
<option>News</option>
</select>

<button onclick="generate()">
🚀 Generate Content
</button>

<pre id="output"></pre>

</div>

<script>

function generate(){

let topic=document.getElementById("topic").value;
let lang=document.getElementById("language").value;
let cat=document.getElementById("category").value;

document.getElementById("output").innerText=

`🎬 Title
${topic}

🌍 Language
${lang}

📂 Category
${cat}

🔥 Hook
Amazing update about ${topic}

📝 Script
Welcome to SouthReel AI.

Today we are talking about ${topic}.

Watch till the end.

👍 Like ❤️ Share 🔔 Subscribe`;

}

</script>

</body>
</html>
