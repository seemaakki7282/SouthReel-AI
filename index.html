<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SouthReel AI Pro</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

h1{
color:#00ff99;
}

textarea,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
border-radius:8px;
}

button{
width:100%;
padding:15px;
font-size:20px;
background:#00ff99;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#00dd88;
}

pre{
margin-top:20px;
background:#222;
padding:15px;
border-radius:10px;
white-space:pre-wrap;
}
</style>

</head>

<body>

<div class="container">

<h1>🎬 SouthReel AI Pro</h1>

<label>Video Topic</label>

<textarea id="topic" placeholder="Example: Pushpa 3"></textarea>

<label>Language</label>

<select id="language">
<option>English</option>
<option>Hindi</option>
<option>Gujarati</option>
</select>

<label>Category</label>

<select id="category">
<option>Movies</option>
<option>Football</option>
<option>Gaming</option>
<option>Technology</option>
<option>News</option>
</select>

<button onclick="generate()">
🚀 Generate Content
</button>

<pre id="output"></pre>

</div>

<script>

const API_KEY = "AQ.Ab8RN6J46OVxLbCBevSONt90k3kud2ak52fn7eNBzjEYvvkMeA";

async function askGemini(prompt){

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`,
{
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    contents: [{
      parts: [{
        text: prompt
      }]
    }]
  })
});

const data = await response.json();

return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";

}

async function generate(){

const topic=document.getElementById("topic").value;
const lang=document.getElementById("language").value;
const cat=document.getElementById("category").value;

document.getElementById("output").innerText="Generating...";
const prompt = `
Create a YouTube package.

Topic: ${topic}
Language: ${lang}
Category: ${cat}

Give:
1. SEO Title
2. Hook
3. Full Script
4. Description
5. 20 Tags
6. Hashtags
`;

const result = await askGemini(prompt);

document.getElementById("output").innerText = result;
}
function copyOutput() {
  const text =
document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
  alert("✅ Output Copied!");
}
</script>

</body>
</html>
