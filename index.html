<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SouthReel AI</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:20px;">

<h1>🎬 SouthReel AI</h1>

<textarea id="topic" placeholder="Enter Topic"
style="width:100%;height:120px;font-size:18px;"></textarea>

<br><br>

<button onclick="generate()" style="padding:15px 30px;font-size:18px;">
Generate Script
</button>

<pre id="output" style="white-space:pre-wrap;margin-top:20px;"></pre>

<script>
async function generate(){

let topic=document.getElementById("topic").value;

document.getElementById("output").innerText="Generating...";

document.getElementById("output").innerText=
`🎬 Title: ${topic}

🔥 Hook:
This is an amazing video about ${topic}.

📜 Script:
Welcome to SouthReel AI.
Today we are talking about ${topic}.
This video covers the latest updates, interesting facts, and why everyone is excited.
Watch until the end for more amazing content.

👉 CTA:
Like 👍 Share ❤️ Subscribe 🔔`;

}
</script>

</body>
</html>
